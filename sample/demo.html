<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Converter Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #f8fafc;
      color: #17202a;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .stage {
      position: relative;
      display: grid;
      align-content: center;
      width: 100%;
      height: 100vh;
      padding: 8vw;
      background:
        linear-gradient(90deg, rgba(15, 118, 110, 0.13) 1px, transparent 1px),
        linear-gradient(0deg, rgba(29, 78, 216, 0.12) 1px, transparent 1px),
        #ffffff;
      background-size: 64px 64px;
    }

    .label {
      color: #0f766e;
      font-size: clamp(18px, 2vw, 36px);
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 920px;
      margin: 18px 0 0;
      font-size: clamp(56px, 9vw, 148px);
      line-height: 0.92;
      letter-spacing: 0;
    }

    .bar {
      position: absolute;
      left: 8vw;
      bottom: 8vw;
      width: 44vw;
      height: 18px;
      overflow: hidden;
      border-radius: 8px;
      background: #e5e7eb;
    }

    .bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: #1d4ed8;
      animation: move 2.8s ease-in-out infinite alternate;
    }

    .dot {
      position: absolute;
      right: 12vw;
      top: 18vh;
      width: 120px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #b45309;
      animation: float 3s ease-in-out infinite alternate;
    }

    @keyframes move {
      to {
        transform: translateX(120%);
      }
    }

    @keyframes float {
      to {
        transform: translateY(34vh);
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="label">Demo render</div>
    <h1>HTML becomes MP4</h1>
    <div class="dot"></div>
    <div class="bar"></div>
  </main>
</body>
</html>
